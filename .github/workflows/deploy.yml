name: Deploy marketplace site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".claude-plugin/marketplace.json"
      - "plugins/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

# Least-privilege GITHUB_TOKEN: only what's needed to checkout the repo.
# Bounds blast radius if any third-party step (npm/pnpm pull, here.now
# fetch) is ever compromised — the token can't push, modify issues/PRs,
# or touch anything beyond reading repo contents.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for `git log -1 --format=%cs -- plugins/<name>` per plugin

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install site dependencies (pinned versions)
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: site
        run: pnpm build

      - name: Install here.now publish script
        # Direct fetch of just publish.sh, pinned to a specific commit SHA.
        # - Reproducible: same script every run; can't change underneath us.
        # - Tamper-evident: SHA-256 verification fails the run if the served
        #   content drifts from what was audited at this commit.
        # - Minimum surface: no installer, no extra files, no jq binary —
        #   ubuntu-latest provides jq, and publish.sh falls back to system jq
        #   when no bundled `bin/jq` exists.
        # Pin: heredotnow/skill@282d29d (2026-04-28, past 72h cooldown).
        # Last publish.sh change: 44e0208 (2026-04-27).
        run: |
          mkdir -p ~/.claude/skills/here-now/scripts
          SCRIPT_URL="https://raw.githubusercontent.com/heredotnow/skill/282d29df5313e896c0e8fc36c8a53b624b20796a/here-now/scripts/publish.sh"
          EXPECTED_SHA256="98a617c54c95a29bb447efb876cf7d621f7456947905cd2a4051f324881916a7"
          curl -fsSL --proto '=https' --tlsv1.2 "$SCRIPT_URL" \
            -o ~/.claude/skills/here-now/scripts/publish.sh
          ACTUAL_SHA256="$(sha256sum ~/.claude/skills/here-now/scripts/publish.sh | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::publish.sh checksum mismatch (expected $EXPECTED_SHA256, got $ACTUAL_SHA256)" >&2
            exit 1
          fi
          chmod +x ~/.claude/skills/here-now/scripts/publish.sh
          echo "OK publish.sh installed (sha256: $ACTUAL_SHA256)"

      - name: Deploy to here.now
        env:
          HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
          # First deploy: leave HERENOW_SLUG unset → POST /api/v1/publish
          # creates a new site with an auto-assigned slug (printed in this
          # step's output). Set the printed value as a repo variable named
          # HERENOW_SLUG (Settings → Variables → Actions). Every subsequent
          # deploy then sends PUT /api/v1/publish/<slug> to update in place.
          HERENOW_SLUG: ${{ vars.HERENOW_SLUG }}
        run: |
          set -e
          PUBLISH=~/.claude/skills/here-now/scripts/publish.sh
          TITLE="HP-00 / Plugins"
          DESC="Security-first plugins for Claude Code"

          if [ -n "$HERENOW_SLUG" ]; then
            echo "Updating existing slug: $HERENOW_SLUG"
            "$PUBLISH" site/dist \
              --slug "$HERENOW_SLUG" \
              --title "$TITLE" \
              --description "$DESC"
          else
            echo "No HERENOW_SLUG set — creating a new publish (first deploy path)"
            "$PUBLISH" site/dist \
              --title "$TITLE" \
              --description "$DESC" \
              | tee /tmp/publish.out
            echo
            echo "::notice title=Set HERENOW_SLUG variable::Copy the slug from the URL above and set it as a repo variable named HERENOW_SLUG (Settings → Secrets and variables → Actions → Variables tab). Future deploys will then update the same site instead of creating new ones."
          fi
